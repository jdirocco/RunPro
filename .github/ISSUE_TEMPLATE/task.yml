name: Task
description: A unit of development work (one branch, one PR)
labels: ["type:task"]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What to build or change, and where (modules, files).
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Verifiable acceptance criteria (tests, behaviour on the watch).
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "#12, #15"
