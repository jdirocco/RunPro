[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ktlint-plugin = "14.2.0"
ktlint-engine = "1.8.0"
detekt = "2.0.0-alpha.6"
activity = "1.13.0"
wear-compose = "1.7.2"
compose = "1.12.1"
junit = "5.13.4"
junit4 = "4.13.2"
kotlinx-serialization = "1.13.0"
kotlinx-coroutines = "1.11.0"
robolectric = "4.16.1"
robolectric-android-all-api30 = "11-robolectric-6757853-i7"
robolectric-android-all-api34 = "14-robolectric-10818077-i7"
androidx-core = "1.18.0"
wear-ongoing = "1.1.0"
garmin-fit = "21.176.0"
play-services-wearable = "19.0.0"
androidx-fragment = "1.8.5"
health-services = "1.1.0"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wear-ongoing" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "play-services-wearable" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
androidx-health-services = { module = "androidx.health:health-services-client", version.ref = "health-services" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
garmin-fit = { module = "com.garmin:fit", version.ref = "garmin-fit" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.13.4" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all-api30 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-android-all-api30" }
robolectric-android-all-api34 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-android-all-api34" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
